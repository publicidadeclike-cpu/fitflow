            function normalizeSupabaseUrl(rawUrl) {
                if (!rawUrl) return '';
                // Remove /rest/v1 e barras finais duplicadas automaticamente
                return String(rawUrl)
                    .trim()
                    .replace(/\/rest\/v1\/?$/i, '')
                    .replace(/\/+$/, '');
            }

            function getSupabaseCredentials() {
                if (
                    SUPABASE_URL &&

                    !SUPABASE_URL.includes('SUA_URL_DO_SUPABASE') &&
                    !SUPABASE_ANON_KEY.includes('SUA_CHAVE_ANON_SUPABASE')

                    const saved = JSON.parse(localStorage.getItem(CFG_STORAGE_KEY) || 'null');
                    if (saved && saved.url && saved.key) {
                        return { url: normalizeSupabaseUrl(saved.url), key: saved.key.trim(), source: 'storage' };
                    }
                } catch (e) {}
                return null;
            }

                const creds = getSupabaseCredentials();

            // =========================================================================
            // 5. CAMADA DE SINCRONIZAÇÃO DE DADOS (SUPABASE CLOUD + LOCAL FALLBACK)
            // =========================================================================
            function setLoader(visible, text = 'Sincronizando com a nuvem...') {
                const el = document.getElementById('global-loader');
                const txt = document.getElementById('loader-text');
                if (!el) return;
                if (txt) txt.textContent = text;
                if (visible) el.classList.remove('hidden');
                else el.classList.add('hidden');
            }

            function saveLocalFallback() {
                try {
                    localStorage.setItem(LOCAL_DB_KEY, JSON.stringify({
                        usuarios: state.usuarios,
                        fichas: state.fichas,
                        modelos: state.modelos
                    }));
                } catch (e) {
                    showToast('Armazenamento local cheio. Use fotos menores.', 'warning');
                }
            }

            function loadLocalFallback() {
                try {
                    const raw = localStorage.getItem(LOCAL_DB_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.usuarios) && parsed.usuarios.length > 0) {
                            state.usuarios = parsed.usuarios;
                            state.fichas = parsed.fichas || [];
                            state.modelos = parsed.modelos || [];
                            return;
                        }
                    }
                } catch (e) {}
                const seed = buildSeedPayload();
                state.usuarios = seed.usuarios;
                state.fichas = seed.fichas;
                state.modelos = seed.modelos;
                saveLocalFallback();
            }

            async function syncAllDataFromSource(showSpinner = true) {
                if (!isCloudConnected || !supabaseClient) {
                    loadLocalFallback();
                    restoreSessionUser();
                    render();
                    return;
                }

                if (showSpinner) setLoader(true, 'Carregando dados do Supabase...');
                try {
                    const { data: usersData, error: usersErr } = await supabaseClient
                        .from('usuarios')
                        .select('*')
                        .order('criado_em', { ascending: true });

                    if (usersErr) throw usersErr;

                    // Se o banco Supabase estiver vazio, executa o Seed inicial automático
                    if (!usersData || usersData.length === 0) {
                        setLoader(true, 'Populando banco inicial no Supabase...');
                        const seed = buildSeedPayload();
                        const { error: insUsersErr } = await supabaseClient.from('usuarios').insert(seed.usuarios);
                        if (insUsersErr) throw insUsersErr;

                        const { error: insFichasErr } = await supabaseClient.from('fichas_alunos').insert(seed.fichas);
                        if (insFichasErr) throw insFichasErr;

                        const { error: insModelosErr } = await supabaseClient.from('modelos_treino').insert(seed.modelos);
                        if (insModelosErr) throw insModelosErr;

                        state.usuarios = seed.usuarios;
                        state.fichas = seed.fichas;
                        state.modelos = seed.modelos;
                        showToast('Banco Supabase inicializado com dados de demonstração!', 'success');
                    } else {
                        const [{ data: fichasData, error: fErr }, { data: modelosData, error: mErr }] = await Promise.all([
                            supabaseClient.from('fichas_alunos').select('*'),
                            supabaseClient.from('modelos_treino').select('*').order('criado_em', { ascending: true })
                        ]);
                        if (fErr) throw fErr;
                        if (mErr) throw mErr;

                        state.usuarios = usersData;
                        state.fichas = fichasData || [];
                        state.modelos = modelosData || [];
                    }

                    restoreSessionUser();
                } catch (err) {
                    console.error('Erro na comunicação com Supabase:', err);
                    const msg = String(err?.message || '');
                    if (err?.code === '42501' || msg.toLowerCase().includes('row-level security')) {
                        showToast('Permissão RLS pendente no Supabase! Abra "Configurar Chaves" para copiar o SQL.', 'error');
                        state.modal = { type: 'config_supabase', payload: { rlsError: true } };
                    } else {
                        showToast('Erro ao conectar no Supabase: ' + (msg || 'Verifique URL/Chave.'), 'error');
                    }
                    isCloudConnected = false;
                    loadLocalFallback();
                    restoreSessionUser();
                } finally {
                    setLoader(false);
                    render();
                }
            }

            function persistSessionUser() {
                if (state.currentUser) {
                    try {
                        localStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser.id));
                    } catch (e) {}
                } else {
                    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
                }
            }

            function restoreSessionUser() {
                try {
                    const savedId = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
                    if (savedId) {
                        const found = state.usuarios.find(u => String(u.id) === String(savedId));
                        if (found) {
                            state.currentUser = found;
                            return;
                        }
                    }
                } catch (e) {}
                state.currentUser = null;
            }

            // =========================================================================
            // 6. UTILITÁRIOS DE FOTO, AVATAR E TOAST
            // =========================================================================
            function showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const id = 'toast-' + Date.now();
                const bg = type === 'error' ? 'bg-red-500/90 text-slate-950 border-red-400' : type === 'warning' ? 'bg-amber-500/90 text-slate-950 border-amber-400' : 'bg-emerald-500/90 text-slate-950 border-emerald-400';
                const icon = type === 'error' ? 'ph-warning-octagon' : type === 'warning' ? 'ph-warning' : 'ph-check-circle';

                const el = document.createElement('div');
                el.id = id;
                el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md text-xs font-bold transition-all duration-300 translate-y-2 opacity-0 ${bg}`;
                el.innerHTML = `
                    <i class="ph-bold ${icon} text-lg shrink-0"></i>
                    <span class="flex-1">${escapeHtml(message)}</span>
                    <button onclick="document.getElementById('${id}').remove()" class="opacity-70 hover:opacity-100"><i class="ph-bold ph-x"></i></button>
                `;
                container.appendChild(el);
                setTimeout(() => { el.classList.remove('translate-y-2', 'opacity-0'); }, 20);
                setTimeout(() => {
                    el.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => el.remove(), 300);
                }, 4000);
            }

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function renderAvatar(userOrName, sizeClass = 'w-10 h-10', textClass = 'text-xs', borderClass = 'border-slate-800') {
                let foto = '';
                let nome = '';
                if (typeof userOrName === 'string') {
                    nome = userOrName;
                } else if (userOrName && typeof userOrName === 'object') {
                    foto = userOrName.foto;
                    nome = userOrName.nome || 'Usuário';
                }

                if (foto && typeof foto === 'string' && foto.trim() !== '') {
                    return `<img src="${escapeHtml(foto)}" alt="${escapeHtml(nome)}" class="${sizeClass} rounded-2xl object-cover border ${borderClass}">`;
                }

            function compressImageFile(file, callback) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 200;
                        let w = img.width;
                        let h = img.height;
                        if (w > h) {
                            if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
                        } else {
                            if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        callback(dataUrl);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            window.saveMeuPerfil = async function(event) {
                event.preventDefault();
                const fd = new FormData(event.target);
                const nome = fd.get('nome').trim();
                const senhaAtual = fd.get('senhaAtual');
                const novaSenha = fd.get('novaSenha');
                const confSenha = fd.get('confSenha');
                const u = state.currentUser;

                if (novaSenha) {
                    if (!senhaAtual || senhaAtual !== u.senha) {
                        showToast('A senha atual está incorreta.', 'error');
                        return;
                    }
                    if (novaSenha.length < 6) {
                        showToast('A nova senha deve ter pelo menos 6 caracteres.', 'error');
                        return;
                    }
                    if (novaSenha !== confSenha) {
                        showToast('As novas senhas não coincidem.', 'error');
                        return;
                    }
                    u.senha = novaSenha;
                }

                u.nome = nome;
                if (state.tempPhoto !== undefined) {
                    u.foto = state.tempPhoto;
                }

                if (isCloudConnected && supabaseClient) {
                    setLoader(true, 'Atualizando perfil...');
                    const updatePayload = {
                        nome: u.nome,
                        foto: u.foto
                    };
                    if (novaSenha) updatePayload.senha = u.senha;

                    const { error } = await supabaseClient.from('usuarios').update(updatePayload).eq('id', u.id);
                    setLoader(false);
                    if (error) {
                        showToast('Erro ao atualizar no Supabase: ' + error.message, 'error');
                        return;
                    }
                }
                saveLocalFallback();
                showToast('Perfil e senha atualizados com sucesso!', 'success');
                closeModal();
                render();
            };

                if (!state.tempModelExercises[l]) state.tempModelExercises[l] = [];
                state.tempModelExercises[l].push({
                    id: Date.now(),
                    nome: '',
                    series: 3,
                    repeticoes: '12',
                    carga: '15 kg',
                    descanso: '60s'
                });
                render();
            };

            window.removeModelExerciseRow = function(idx) {
                const l = state.activeModelLetter;
                if (state.tempModelExercises[l]) {
                    state.tempModelExercises[l].splice(idx, 1);
                    render();
                }
            };

            async function saveModelForm(event) {
                event.preventDefault();
                const fd = new FormData(event.target);
                const id = fd.get('id');
                const nome = fd.get('nome').trim();

                const container = document.getElementById('model-ex-list');
                const l = state.activeModelLetter;
                if (container) {
                    const rows = container.querySelectorAll('.model-ex-row');
                    const updated = [];
                    rows.forEach(r => {
                        const n = r.querySelector('[data-field="nome"]')?.value.trim() || '';
                        const s = parseInt(r.querySelector('[data-field="series"]')?.value) || 3;
                        const rep = r.querySelector('[data-field="repeticoes"]')?.value.trim() || '12';
                        const c = r.querySelector('[data-field="carga"]')?.value.trim() || '';
                        const d = r.querySelector('[data-field="descanso"]')?.value.trim() || '60s';
                        if (n) updated.push({ id: Math.random(), nome: n, series: s, repeticoes: rep, carga: c, descanso: d });
                    });
                    state.tempModelExercises[l] = updated;
                }

                if (id) {
                    const mod = state.modelos.find(m => String(m.id) === String(id));
                    if (mod) {
                        mod.nome = nome;
                        mod.treinos = JSON.parse(JSON.stringify(state.tempModelExercises));
                        if (isCloudConnected && supabaseClient) {
                            setLoader(true, 'Atualizando modelo...');
                            await supabaseClient.from('modelos_treino').update({
                                nome: mod.nome, treinos: mod.treinos
                            }).eq('id', mod.id);
                            setLoader(false);
                        }
                    }
                } else {
                    const newMod = {
                        id: crypto.randomUUID(),
                        nome,
                        criado_por: state.currentUser.id,
                        treinos: JSON.parse(JSON.stringify(state.tempModelExercises))
                    };
                    state.modelos.push(newMod);
                    if (isCloudConnected && supabaseClient) {
                        setLoader(true, 'Criando modelo...');
                        await supabaseClient.from('modelos_treino').insert([newMod]);
                        setLoader(false);
                    }
                }

                saveLocalFallback();
                showToast('Modelo de treino salvo com sucesso!', 'success');
                closeModal();
                render();
            }

            async function deleteModel(modeloId) {
                if (confirm('Deseja realmente excluir este modelo de treino?')) {
                    state.modelos = state.modelos.filter(m => String(m.id) !== String(modeloId));
                    if (isCloudConnected && supabaseClient) {
                        setLoader(true, 'Excluindo modelo...');
                        await supabaseClient.from('modelos_treino').delete().eq('id', modeloId);
                        setLoader(false);
                    }
                    saveLocalFallback();
                    showToast('Modelo excluído.', 'success');
                    render();
                }
            }

            async function deleteStudent(alunoId) {
                if (confirm('Deseja realmente excluir este aluno e sua ficha de treino?')) {
                    state.usuarios = state.usuarios.filter(u => String(u.id) !== String(alunoId));
                    state.fichas = state.fichas.filter(f => String(f.aluno_id) !== String(alunoId));
                    if (isCloudConnected && supabaseClient) {

                        await supabaseClient.from('fichas_alunos').delete().eq('aluno_id', alunoId);
                        setLoader(false);
                    }
                    saveLocalFallback();
                    showToast('Aluno excluído.', 'success');
                    render();
                }
            }

                                                    <input type="text" data-field="nome" value="${escapeHtml(ex.nome)}" placeholder="Nome" class="w-full bg-slate-900 border border-slate-800 text-white px-3 py-2 rounded-xl text-xs">
                                                </div>
                                                <div class="col-span-3 sm:col-span-1">
                                                    <label class="block text-[10px] text-slate-400 font-bold mb-0.5">Séries</label>
                                                    <input type="number" data-field="series" min="1" value="${escapeHtml(ex.series)}" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <label class="block text-[10px] text-slate-400 font-bold mb-0.5">Reps</label>
                                                    <input type="text" data-field="repeticoes" value="${escapeHtml(ex.repeticoes)}" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <label class="block text-[10px] text-slate-400 font-bold mb-0.5">Carga</label>
                                                    <input type="text" data-field="carga" value="${escapeHtml(ex.carga)}" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <label class="block text-[10px] text-slate-400 font-bold mb-0.5">Descanso</label>
                                                    <input type="text" data-field="descanso" value="${escapeHtml(ex.descanso || '60s')}" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-12 sm:col-span-1 flex justify-end pt-3">
                                                    <button type="button" onclick="removeExerciseRow(${idx})" class="p-2 text-slate-400 hover:text-red-400">
                                                        <i class="ph-bold ph-trash"></i>
                                                    </button>
                                                </div>
                                                <div class="col-span-12">
                                                    <input type="text" data-field="obs" value="${escapeHtml(ex.obs || '')}" placeholder="Observações (opcional: cadência, técnica, etc.)" class="w-full bg-slate-900/70 border border-slate-800/80 text-slate-300 px-3 py-1.5 rounded-xl text-[11px]">
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <button type="button" onclick="addExerciseRow()" class="w-full py-2.5 rounded-xl border border-dashed border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/10 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <i class="ph-bold ph-plus"></i>
                                        <span>Adicionar Exercício</span>
                                    </button>

                                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-700 text-xs font-bold text-slate-300">Cancelar</button>
                                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold">Salvar Treino ${letra}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                }

                if (type === 'renovar_ciclo') {
                    const aluno = state.usuarios.find(u => String(u.id) === String(payload.alunoId));
                    if (!aluno) return '';
                    const ficha = getFichaByAlunoId(aluno.id);
                    return `
                        <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 class="text-lg font-black text-white">Renovar Ciclo de Treino</h3>
                                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-lg"></i></button>
                                </div>
                                <form onsubmit="saveCycleRenewal(event)" class="space-y-4">
                                    <input type="hidden" name="alunoId" value="${aluno.id}">
                                    <div class="bg-slate-950 border border-slate-800 p-3.5 rounded-2xl flex items-center gap-3">
                                        ${renderAvatar(aluno, 'w-11 h-11', 'text-sm', 'border-amber-500')}
                                        <div>
                                            <span class="block text-xs font-bold text-white">${escapeHtml(aluno.nome)}</span>
                                            <span class="block text-[11px] text-slate-400">Sessões atuais: ${ficha.sessoes_concluidas}/${ficha.meta_sessoes}</span>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-xs font-bold text-slate-300 mb-1">Nova Meta Sessões</label>
                                            <input type="number" name="metaSessoes" min="1" required value="${ficha.meta_sessoes || 35}" class="w-full bg-slate-950 border border-slate-800 text-white px-3.5 py-2.5 rounded-xl text-xs">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-slate-300 mb-1">Novo Vencimento</label>
                                            <input type="date" name="dataVencimento" value="2027-01-30" class="w-full bg-slate-950 border border-slate-800 text-white px-3.5 py-2.5 rounded-xl text-xs">
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-emerald-300 mb-1">Ficha para o Novo Ciclo</label>
                                        <select name="modeloId" class="w-full bg-slate-950 border border-emerald-500/40 text-white px-3.5 py-2.5 rounded-xl text-xs">
                                            <option value="">Manter exercícios atuais e zerar contador</option>
                                            ${state.modelos.map(m => `<option value="${m.id}">Substituir por modelo: ${escapeHtml(m.nome)}</option>`).join('')}
                                        </select>
                                    </div>

                                    <div class="flex justify-end gap-2 pt-2">
                                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-700 text-xs font-bold text-slate-300">Cancelar</button>
                                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold">Liberar Novo Ciclo</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                }

                if (type === 'form_modelo') {
                    const mod = payload.modelo || {};
                    const l = state.activeModelLetter;
                    const list = state.tempModelExercises[l] || [];

                    return `
                        <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-2xl p-6 space-y-4 shadow-2xl my-auto">
                                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 class="text-lg font-black text-white">${mod.id ? 'Editar Modelo' : 'Criar Novo Modelo de Treino'}</h3>
                                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-lg"></i></button>
                                </div>

                                <form onsubmit="saveModelForm(event)" class="space-y-4">
                                    <input type="hidden" name="id" value="${mod.id || ''}">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-300 mb-1">Nome do Modelo *</label>
                                        <input type="text" name="nome" required value="${escapeHtml(mod.nome || '')}" placeholder="Ex: Hipertrofia ABC" class="w-full bg-slate-950 border border-slate-800 text-white px-3.5 py-2.5 rounded-xl text-xs focus:outline-none focus:border-emerald-500">
                                    </div>

                                    <div class="flex gap-2 border-b border-slate-800 pb-2">
                                        ${LETRAS.map(letra => {
                                            const count = (state.tempModelExercises[letra] || []).length;
                                            const active = l === letra;
                                            return `
                                                <button type="button" onclick="switchModelLetter('${letra}')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 ${active ? 'bg-emerald-500 text-slate-950' : 'bg-slate-950 text-slate-300 hover:bg-slate-800'}">
                                                    <span>Treino ${letra}</span>
                                                    <span class="px-1.5 py-0.5 rounded-full text-[10px] ${active ? 'bg-slate-950 text-emerald-400' : 'bg-slate-800 text-slate-400'}">${count}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    <div id="model-ex-list" class="max-h-[42vh] overflow-y-auto custom-scrollbar space-y-2 pr-1">
                                        ${list.length === 0 ? `
                                            <p class="text-xs text-slate-400 text-center py-6 bg-slate-950 rounded-2xl border border-dashed border-slate-800">
                                                Treino ${l} vazio. Clique abaixo para adicionar exercícios.
                                            </p>
                                        ` : list.map((ex, idx) => `
                                            <div class="model-ex-row bg-slate-950 border border-slate-800 p-3 rounded-2xl grid grid-cols-12 gap-2 items-center">
                                                <div class="col-span-12 sm:col-span-4">
                                                    <input type="text" data-field="nome" value="${escapeHtml(ex.nome)}" placeholder="Exercício" class="w-full bg-slate-900 border border-slate-800 text-white px-3 py-2 rounded-xl text-xs">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <input type="number" data-field="series" min="1" value="${escapeHtml(ex.series)}" placeholder="Séries" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <input type="text" data-field="repeticoes" value="${escapeHtml(ex.repeticoes)}" placeholder="Reps" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-3 sm:col-span-2">
                                                    <input type="text" data-field="carga" value="${escapeHtml(ex.carga)}" placeholder="Carga" class="w-full bg-slate-900 border border-slate-800 text-white px-2 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-2 sm:col-span-1">
                                                    <input type="text" data-field="descanso" value="${escapeHtml(ex.descanso || '60s')}" placeholder="60s" class="w-full bg-slate-900 border border-slate-800 text-white px-1.5 py-2 rounded-xl text-xs text-center">
                                                </div>
                                                <div class="col-span-1 flex justify-end">
                                                    <button type="button" onclick="removeModelExerciseRow(${idx})" class="p-1.5 text-slate-400 hover:text-red-400">
                                                        <i class="ph-bold ph-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <button type="button" onclick="addModelExerciseRow()" class="w-full py-2.5 rounded-xl border border-dashed border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/10 text-xs font-bold flex items-center justify-center gap-1.5">
                                        <i class="ph-bold ph-plus"></i>
                                        <span>Adicionar Exercício ao Treino ${l}</span>
                                    </button>

                                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-700 text-xs font-bold text-slate-300">Cancelar</button>
                                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold">Salvar Modelo</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                }

                return '';
            }

            window.saveSupabaseConfigModal = function(event) {
                event.preventDefault();
                const url = document.getElementById('cfg-url-input')?.value.trim();
                const key = document.getElementById('cfg-key-input')?.value.trim();
                if (url && key) {
                    try {
                        localStorage.setItem(CFG_STORAGE_KEY, JSON.stringify({ url: normalizeSupabaseUrl(url), key }));
                        showToast('Configurações salvas! Conectando...', 'success');
                        closeModal();
                        initSupabaseClient();
                        syncAllDataFromSource(true);
                    } catch (e) {
                        showToast('Erro ao salvar no navegador.', 'error');
                    }
                }
            };

            // =========================================================================
            // 12. RENDERIZAÇÃO PRINCIPAL E BOOTSTRAP
            // =========================================================================
            window.render = function () {
                const app = document.getElementById('app');
                if (!app) return;

                if (!state.currentUser) {
                    app.innerHTML = renderLoginScreen() + renderModal();
                    return;
                }

                let content = '';
                if (state.activeTab === 'alunos' && state.currentUser.tipo !== 'aluno') {
                    content = renderStudentsTab();
                } else if (state.activeTab === 'modelos' && state.currentUser.tipo !== 'aluno') {
                    content = renderModelsTab();
                } else if (state.activeTab === 'professores' && state.currentUser.tipo === 'admin') {
                    content = renderProfessorsTab();
                } else {
                    content = renderFichaTab();
                }

                app.innerHTML = `
                    ${renderHeader()}
                    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
                        ${content}
                    </main>
                    ${renderModal()}
                `;
            };

            async function bootstrap() {
                initSupabaseClient();
                await syncAllDataFromSource(isCloudConnected);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bootstrap);
            } else {
                bootstrap();
            }
        })();
    </script>
</body>
</html>
