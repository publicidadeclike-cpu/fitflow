        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            ],

                            ]

                {

        // --- UTILITÁRIOS ---
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500/95 text-white border-red-400' : 'bg-emerald-500/95 text-slate-950 border-emerald-400';
            const icon = type === 'error' ? 'ph-warning-circle' : 'ph-check-circle';
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl border shadow-2xl text-xs font-bold transition-all duration-300 ${bgColor}`;
            toast.innerHTML = `<i class="ph-bold ${icon} text-base"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = '';
        }

        function showConfirmModal(title, message, onConfirm) {
            const container = document.getElementById('modal-container');
            if (!container) return;
            container.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
                    <div class="bg-dark-800 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
                        <div class="flex items-center gap-3 text-red-400">
                            <div class="w-10 h-10 rounded-2xl bg-red-500/10 flex items-center justify-center">
                                <i class="ph-bold ph-warning text-xl"></i>
                            </div>
                            <h3 class="text-base font-black text-white">${escapeHtml(title)}</h3>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(message)}</p>
                        <div class="flex justify-end gap-3 pt-2">
                            <button id="modal-cancel-btn" class="px-4 py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 cursor-pointer">Cancelar</button>
                            <button id="modal-confirm-btn" class="px-5 py-2.5 rounded-2xl bg-red-500 hover:bg-red-400 text-white text-xs font-black shadow-lg shadow-red-500/20 cursor-pointer">Sim, Excluir</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-cancel-btn').onclick = closeModal;
            document.getElementById('modal-confirm-btn').onclick = async () => {
                closeModal();
                await onConfirm();
            };
        }

        // --- INICIALIZAÇÃO E SINCRONIZAÇÃO COM SUPABASE ---
        async function initCloudSync() {
            try {
                try {
                    const savedUser = localStorage.getItem('fitflow_remembered_user');
                    if (savedUser) {
                        const parsed = JSON.parse(savedUser);
                        if (parsed && parsed.id) state.sessionRememberedId = parsed.id;
                    }
                } catch (_) {}

                const [resUsers, resFichas, resModelos] = await Promise.all([
                    supabaseClient.from('usuarios').select('*'),
                    supabaseClient.from('fichas').select('*'),
                    supabaseClient.from('modelos').select('*')
                ]);

                if (resUsers.error) throw resUsers.error;

                state.isOnline = true;
                state.usuarios = (resUsers.data && resUsers.data.length > 0) ? resUsers.data : [...MOCK_DATA.usuarios];
                state.fichas = (resFichas.data && resFichas.data.length > 0) ? resFichas.data : [...MOCK_DATA.fichas];
                state.modelos = (resModelos.data && resModelos.data.length > 0) ? resModelos.data : [...MOCK_DATA.modelos];

                if (!resUsers.data || resUsers.data.length === 0) {
                    await persistData();
                }

                supabaseClient
                    .channel('fitflow-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios' }, () => refreshFromSupabase())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'fichas' }, () => refreshFromSupabase())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'modelos' }, () => refreshFromSupabase())
                    .subscribe();

                syncCurrentUser();
                state.loading = false;
                render();
            } catch (e) {
                console.warn("Aviso ao conectar no Supabase:", e);
                fallbackToMemory();
            }
        }

        async function refreshFromSupabase() {
            try {
                const [resUsers, resFichas, resModelos] = await Promise.all([
                    supabaseClient.from('usuarios').select('*'),
                    supabaseClient.from('fichas').select('*'),
                    supabaseClient.from('modelos').select('*')
                ]);
                if (!resUsers.error && resUsers.data) state.usuarios = resUsers.data;
                if (!resFichas.error && resFichas.data) state.fichas = resFichas.data;
                if (!resModelos.error && resModelos.data) state.modelos = resModelos.data;
                syncCurrentUser();
                render();
            } catch (err) {
                console.error("Erro ao atualizar dados em tempo real:", err);
            }
        }

        function fallbackToMemory() {
            if (state.usuarios.length === 0) {
                state.usuarios = [...MOCK_DATA.usuarios];
                state.fichas = [...MOCK_DATA.fichas];
                state.modelos = [...MOCK_DATA.modelos];
            }
            syncCurrentUser();
            state.loading = false;
            render();
        }

        function syncCurrentUser() {
            if (state.currentUser) {
                const updated = state.usuarios.find(u => String(u.id) === String(state.currentUser.id));
                if (updated && updated.ativo !== false) {
                    state.currentUser = updated;
                } else {
                    state.currentUser = null;
                }
            } else if (state.sessionRememberedId) {
                const found = state.usuarios.find(u => String(u.id) === String(state.sessionRememberedId));
                if (found && found.ativo !== false) {
                    state.currentUser = found;
                }
            }
        }

        async function persistData() {
            if (!state.isOnline) return;
            try {
                if (state.usuarios.length > 0) {
                    await supabaseClient.from('usuarios').upsert(state.usuarios);
                    const idsU = state.usuarios.map(u => `"${u.id}"`).join(',');
                    await supabaseClient.from('usuarios').delete().not('id', 'in', `(${idsU})`);
                } else {
                    await supabaseClient.from('usuarios').delete().neq('id', '');
                }

                if (state.fichas.length > 0) {
                    await supabaseClient.from('fichas').upsert(state.fichas);
                    const idsF = state.fichas.map(f => `"${f.id}"`).join(',');
                    await supabaseClient.from('fichas').delete().not('id', 'in', `(${idsF})`);
                } else {
                    await supabaseClient.from('fichas').delete().neq('id', '');
                }

                if (state.modelos.length > 0) {
                    await supabaseClient.from('modelos').upsert(state.modelos);
                    const idsM = state.modelos.map(m => `"${m.id}"`).join(',');
                    await supabaseClient.from('modelos').delete().not('id', 'in', `(${idsM})`);
                } else {
                    await supabaseClient.from('modelos').delete().neq('id', '');
                }
            } catch (err) {
                console.error("Erro ao salvar no Supabase:", err);
                showToast('Erro ao sincronizar com Supabase.', 'error');
            }
        }

                    <form id="user-modal-form" class="bg-dark-800 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">

                            <button type="button" id="close-user-modal" class="text-slate-400 hover:text-white cursor-pointer"><i class="ph-bold ph-x text-lg"></i></button>
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-300">Nome Completo</label>
                            <input type="text" id="modal-user-nome" required value="${escapeHtml(user ? user.nome : '')}" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-300">E-mail de Acesso</label>
                            <input type="email" id="modal-user-email" required value="${escapeHtml(user ? user.email : '')}" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-300">Senha</label>
                            <input type="text" id="modal-user-senha" required value="${escapeHtml(user ? user.senha : '123')}" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                        </div>

                        ${tipo === 'aluno' ? `
                            <div class="space-y-1">

                                <select id="modal-user-prof" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">

                                    ${professores.map(p => `<option value="${p.id}" ${user && String(user.professor_id) === String(p.id) ? 'selected' : ''}>${escapeHtml(p.nome)}</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}

                        <div class="flex justify-end gap-3 pt-3">
                            <button type="button" id="cancel-user-modal" class="px-4 py-2.5 rounded-2xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-300 cursor-pointer">Cancelar</button>
                            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black cursor-pointer">Salvar Dados</button>
                        </div>
                    </form>
                </div>
            `;

            document.getElementById('close-user-modal').onclick = closeModal;
            document.getElementById('cancel-user-modal').onclick = closeModal;
            document.getElementById('user-modal-form').onsubmit = async (e) => {

                const nome = document.getElementById('modal-user-nome').value.trim();
                const email = document.getElementById('modal-user-email').value.trim();
                const senha = document.getElementById('modal-user-senha').value.trim();
                const profEl = document.getElementById('modal-user-prof');
                const professor_id = profEl ? (profEl.value || null) : (user ? user.professor_id : null);

                if (isEdit && user) {
                    user.nome = nome;
                    user.email = email;
                    user.senha = senha;
                    if (tipo === 'aluno') user.professor_id = professor_id;
                    if (state.currentUser && String(state.currentUser.id) === String(user.id)) {
                        state.currentUser = user;
                        try {
                            if (localStorage.getItem('fitflow_remembered_user')) {
                                localStorage.setItem('fitflow_remembered_user', JSON.stringify(user));
                            }
                        } catch (_) {}
                    }
                } else {
                    const newUser = {
                        id: 'u' + Date.now(),
                        nome,
                        email,
                        senha,
                        tipo,
                        ativo: true
                    };
                    if (tipo === 'aluno') newUser.professor_id = professor_id;
                    state.usuarios.push(newUser);
                }

                closeModal();
                await persistData();
                showToast('Dados salvos e sincronizados!', 'success');
                render();
            };
        }

            container.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
                    <form id="modelo-modal-form" class="bg-dark-800 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-black text-white">${isEdit ? 'Editar' : 'Novo'} Modelo de Treino</h3>
                            <button type="button" id="close-mod-modal" class="text-slate-400 hover:text-white cursor-pointer"><i class="ph-bold ph-x text-lg"></i></button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-300">Nome do Modelo</label>

                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-300">Objetivo</label>
                                <input type="text" id="modal-mod-obj" required value="${escapeHtml(mod ? mod.objetivo : '')}" placeholder="Ex: Ganho de Massa" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-300">Exercícios (1 por linha: Nome | Séries | Carga)</label>
                            <textarea id="modal-mod-ex" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-white font-mono focus:outline-none focus:border-emerald-500">${escapeHtml(exText)}</textarea>

                            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black cursor-pointer">Salvar Modelo</button>
                        </div>
                    </form>
                </div>
            `;

            document.getElementById('close-mod-modal').onclick = closeModal;
            document.getElementById('cancel-mod-modal').onclick = closeModal;
            document.getElementById('modelo-modal-form').onsubmit = async (e) => {
                e.preventDefault();
                const nome = document.getElementById('modal-mod-nome').value.trim();
                const objetivo = document.getElementById('modal-mod-obj').value.trim();

                    const p = l.split('|').map(x => x.trim());
                    return { nome: p[0] || 'Exercício', series: p[1] || '3x 12', carga: p[2] || 'Livre' };

                if (isEdit && mod) {
                    mod.nome = nome;
                    mod.objetivo = objetivo;
                    mod.exercicios = exercicios;
                } else {
                    state.modelos.push({
                        id: 'm' + Date.now(),

                        objetivo,

                closeModal();

        // --- RENDERIZAÇÃO PRINCIPAL ---
        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (state.loading) {
                app.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                        <div class="w-12 h-12 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mb-4"></div>
                        <p class="text-sm font-bold text-slate-300">Conectando ao Supabase...</p>
                    </div>
                `;
                return;
            }

            if (!state.currentUser) {
                app.innerHTML = renderLoginScreen();
                return;
            }

            if (state.currentUser.tipo === 'aluno') {
                app.innerHTML = renderAlunoPortal();
                return;
            }

            app.innerHTML = renderStaffPortal();
        }

                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-bold text-slate-300">Senha</label>
                                <input type="password" id="login-password" required placeholder="••••••••" value="123" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-500">

                                    <h2 class="text-base font-black text-white">${escapeHtml(ficha.objetivo || 'Treino Personalizado')}</h2>
                                </div>
                                <div class="text-right">
                                    <span class="text-[11px] font-bold text-slate-400">Progresso do Ciclo</span>
                                    <p class="text-sm font-black text-emerald-400">${ficha.progresso_atual || 0} / ${ficha.progresso_total || 35} treinos</p>
                                </div>
                            </div>

                            <div class="space-y-3">
                                ${(ficha.blocos || []).flatMap(b => b.exercicios || []).map((ex, idx) => `
                                    <div class="bg-slate-950 border border-slate-800/90 rounded-2xl p-4 flex items-center justify-between gap-3">
                                        <div class="flex items-center gap-3">
                                            <span class="w-7 h-7 rounded-xl bg-emerald-500/15 text-emerald-400 text-xs font-black flex items-center justify-center">${idx + 1}</span>
                                            <div>
                                                <h3 class="text-xs font-black text-white">${escapeHtml(ex.nome)}</h3>
                                                ${ex.obs ? `<p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(ex.obs)}</p>` : ''}
                                            </div>
                                        </div>
                                        <div class="text-right shrink-0">
                                            <span class="block text-xs font-black text-emerald-400">${escapeHtml(ex.series)}</span>
                                            <span class="block text-[11px] text-slate-400">${escapeHtml(ex.carga)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <button data-action="concluir-treino" data-id="${ficha.id}" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-lg shadow-emerald-500/20 cursor-pointer flex items-center justify-center gap-2">
                                <i class="ph-bold ph-check-circle text-base"></i>
                                <span>Registrar Treino Concluído Hoje</span>
                            </button>
                        </div>
                    `}
                </main>
            `;
        }

        // --- EVENTOS GLOBAIS ---
        document.addEventListener('click', async (e) => {
            const tabBtn = e.target.closest('[data-tab]');
            if (tabBtn) {
                state.currentTab = tabBtn.dataset.tab;
                state.selectedAlunoId = null;
                render();
                return;
            }

            const btnLogout = e.target.closest('#btn-logout');
            if (btnLogout) {
                state.currentUser = null;
                state.sessionRememberedId = null;
                try { localStorage.removeItem('fitflow_remembered_user'); } catch (_) {}
                render();
                showToast('Sessão encerrada com sucesso.', 'success');
                return;
            }

            const actionBtn = e.target.closest('button[data-action]');
            if (!actionBtn) return;

            const action = actionBtn.dataset.action;
            const id = actionBtn.dataset.id;

            if (action === 'edit-profile') {
                openUserModal(state.currentUser.tipo, state.currentUser.id);
            } else if (action === 'new-aluno') {
                openUserModal('aluno');
            } else if (action === 'edit-aluno') {
                openUserModal('aluno', id);
            } else if (action === 'new-professor') {
                openUserModal('professor');
            } else if (action === 'edit-professor') {
                openUserModal('professor', id);
            } else if (action === 'new-modelo') {
                openModeloModal();
            } else if (action === 'edit-modelo') {
                openModeloModal(id);
            } else if (action === 'open-ficha') {
                state.selectedAlunoId = id;
                render();
            } else if (action === 'back-alunos') {
                state.selectedAlunoId = null;
                render();
            } else if (action === 'toggle-status') {
                const u = state.usuarios.find(x => String(x.id) === String(id));
                if (!u) return;
                u.ativo = u.ativo === false ? true : false;
                await persistData();
                showToast(`Status de ${u.nome} atualizado!`, 'success');
                render();
            } else if (action === 'delete-aluno') {
                const aluno = state.usuarios.find(x => String(x.id) === String(id));
                const nome = aluno ? aluno.nome : 'este aluno';
                showConfirmModal('Excluir Aluno', `Tem certeza que deseja excluir ${nome} e sua ficha de treino?`, async () => {
                    state.usuarios = state.usuarios.filter(x => String(x.id) !== String(id));
                    state.fichas = state.fichas.filter(x => String(x.aluno_id) !== String(id));
                    await persistData();
                    showToast('Aluno excluído com sucesso!', 'success');
                    render();
                });
            } else if (action === 'delete-professor') {
                const prof = state.usuarios.find(x => String(x.id) === String(id));
                const nome = prof ? prof.nome : 'este professor';
                showConfirmModal('Excluir Professor', `Tem certeza que deseja excluir o professor ${nome}?`, async () => {
                    state.usuarios = state.usuarios.filter(x => String(x.id) !== String(id));
                    await persistData();
                    showToast('Professor excluído com sucesso!', 'success');
                    render();
                });
            } else if (action === 'delete-modelo') {
                const mod = state.modelos.find(x => String(x.id) === String(id));
                const nome = mod ? mod.nome : 'este modelo';
                showConfirmModal('Excluir Modelo', `Deseja realmente excluir o modelo "${nome}"?`, async () => {
                    state.modelos = state.modelos.filter(x => String(x.id) !== String(id));
                    await persistData();
                    showToast('Modelo excluído com sucesso!', 'success');
                    render();
                });
            } else if (action === 'concluir-treino') {
                const ficha = state.fichas.find(f => String(f.id) === String(id));
                if (ficha) {
                    ficha.progresso_atual = (Number(ficha.progresso_atual) || 0) + 1;
                    await persistData();
                    showToast('Parabéns! Treino concluído e registrado!', 'success');
                    render();
                }
            }
        });

        window.addEventListener('change', (e) => {
            if (e.target.id === 'ficha-aplicar-modelo') {
                const modId = e.target.value;
                if (!modId) return;
                const mod = state.modelos.find(m => String(m.id) === String(modId));
                if (mod && mod.exercicios) {
                    const textarea = document.getElementById('ficha-exercicios-text');
                    const linhas = mod.exercicios.map(ex => `${ex.nome} | ${ex.series} | ${ex.carga}`).join('\n');
                    textarea.value = textarea.value.trim() ? textarea.value.trim() + '\n' + linhas : linhas;
                    showToast(`Modelo "${mod.nome}" importado!`, 'success');
                }
                e.target.value = '';
            }
        });

        window.addEventListener('submit', async (e) => {
            if (e.target.id === 'ficha-aluno-form') {
                e.preventDefault();
                const alunoId = state.selectedAlunoId;
                const objetivo = document.getElementById('ficha-objetivo').value.trim();
                const treino_atual = document.getElementById('ficha-letra').value.trim() || 'A';
                const progresso_atual = parseInt(document.getElementById('ficha-prog-atual').value) || 0;
                const progresso_total = parseInt(document.getElementById('ficha-prog-total').value) || 35;
                const rawLines = document.getElementById('ficha-exercicios-text').value.split('\n').filter(l => l.trim());

                const exercicios = rawLines.map(line => {
                    const parts = line.split('|').map(p => p.trim());
                    return {
                        nome: parts[0] || 'Exercício',
                        series: parts[1] || '3x 12',
                        carga: parts[2] || 'Livre',
                        obs: parts[3] || ''
                    };
                });

                const idx = state.fichas.findIndex(f => String(f.aluno_id) === String(alunoId));
                const fichaObj = {
                    id: idx !== -1 ? state.fichas[idx].id : 'f' + Date.now(),
                    aluno_id: alunoId,
                    objetivo,
                    treino_atual,
                    progresso_atual,
                    progresso_total,
                    blocos: [{ letra: treino_atual, nome: 'Treino Principal', exercicios }]
                };

                if (idx !== -1) state.fichas[idx] = fichaObj;
                else state.fichas.push(fichaObj);

                await persistData();
                showToast('Ficha salva e sincronizada no Supabase!', 'success');
                render();
                return;
            }

            if (e.target.id === 'login-form') {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const remember = document.getElementById('login-remember').checked;

                const user = state.usuarios.find(u => u.email.toLowerCase() === email.toLowerCase() && u.senha === password);
                if (!user) {
                    showToast('E-mail ou senha incorretos!', 'error');
                    return;
                }
                if (user.ativo === false) {
                    showToast('Esta conta está pausada/inativa.', 'error');
                    return;
                }

                state.currentUser = user;
                if (remember) {
                    state.sessionRememberedId = user.id;
                    try { localStorage.setItem('fitflow_remembered_user', JSON.stringify(user)); } catch (_) {}
                } else {
                    state.sessionRememberedId = null;
                    try { localStorage.removeItem('fitflow_remembered_user'); } catch (_) {}
                }

                showToast(`Bem-vindo de volta, ${user.nome}!`, 'success');
                render();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initCloudSync();
        });
    </script>
</body>
</html>
